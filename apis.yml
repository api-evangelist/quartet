name: Quartet Health
description: 'Quartet Health is a value-based behavioral healthcare enablement and delivery
  platform that identifies, engages, and connects patients with mental health services across
  39 states. It serves health plans, health systems, and community mental health centers with
  care coordination, patient-to-provider matching, and direct delivery of behavioral health
  care through its own medical group, focused on whole-person care for individuals with serious
  mental illness and other behavioral health needs. Quartet was acquired by NeuroFlow. Added
  to the API Evangelist network as a life-sciences company profile; the public site exposes no
  developer or API surface, but does publish a substantive security and compliance program.'
